# Cloudflare Workers + static assets — required so CI `npx wrangler deploy` succeeds.
# Worker name must match the connected Workers Builds project (wardogscheats--org).
name = "wardogscheats--org"
main = "workers/site.js"
compatibility_date = "2026-09-12"

# Cloudflare CI invokes `npx wrangler deploy` directly. Build Astro first so
# the static-assets directory exists before Wrangler validates it.
[build]
command = "npm run build"

# Custom domains — only zones on this Cloudflare account (wardogscheats.org).
[[routes]]
pattern = "wardogscheats.org"
custom_domain = true

[[routes]]
pattern = "www.wardogscheats.org"
custom_domain = true

# Legacy wardogshacks.net: add [[routes]] here only after that zone is on Cloudflare.
# The Worker still 301s unknown hosts → https://wardogscheats.org when they reach this script.

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
# Host redirects need the Worker, but sitemap/robots must stay asset-first
# so Google never hits a Worker/origin timeout (HTTP 522).
run_worker_first = [
  "/*",
  "!/sitemap.xml",
  "!/robots.txt",
  "!/sitemap.css",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
